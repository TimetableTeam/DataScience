name: Data Science CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Tanseek_Model_Starter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas nbconvert nbformat ipykernel

      - name: Run Data Science notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute Tanseek_Menna_Model_Starter.ipynb \
            --output executed_notebook.ipynb